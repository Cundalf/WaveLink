name: Reporte de bug
description: Algo no funciona como debería
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar. Cuanto más concreto sea el reporte, más rápido se puede arreglar.
        Antes de continuar, buscá si ya existe un issue abierto con el mismo problema.

  - type: checkboxes
    id: requisitos
    attributes:
      label: Requisitos previos
      options:
        - label: Busqué en los issues existentes y no encontré este problema.
          required: true
        - label: Uso una versión reciente de WaveLink.
          required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Dónde ocurre
      options:
        - Teléfono
        - Android Auto
        - Cast (Google TV / Chromecast / altavoz)
        - Otro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de WaveLink
      placeholder: "0.3.0 (versionCode 5)"
    validations:
      required: true

  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión de Android
      placeholder: "Pixel 7, Android 15"
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir la app
        2. Agregar una radio con...
        3. Tocar play
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas (opcional)
      description: "`adb logcat | grep -i wavelink` suele alcanzar. No pegues contraseñas ni URLs con `?auth=`."
      render: shell
    validations:
      required: false
