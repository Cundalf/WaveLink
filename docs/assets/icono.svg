<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Radio casting">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0B0C10"/>
            <stop offset="1" stop-color="#1F2833"/>
        </linearGradient>
    </defs>

    <!-- Fondo squircle -->
    <rect width="512" height="512" rx="120" fill="url(#bg)"/>

    <!-- Ondas de señal -->
    <g fill="none" stroke="#66FCF1" stroke-linecap="round">
        <path d="M164 76 A112 112 0 0 1 348 76" stroke-width="20" opacity="0.5"/>
        <path d="M204 103 A64 64 0 0 1 308 103" stroke-width="20" opacity="0.8"/>
    </g>

    <!-- Baliza (glow simulado por capas) -->
    <circle cx="256" cy="140" r="38" fill="#66FCF1" opacity="0.10"/>
    <circle cx="256" cy="140" r="25" fill="#66FCF1" opacity="0.20"/>
    <circle cx="256" cy="140" r="15" fill="#66FCF1"/>

    <!-- Torre -->
    <g fill="none" stroke="#66FCF1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <path d="M244 176 L152 436"/>
        <path d="M268 176 L360 436"/>
        <path d="M206 282 L306 282"/>
        <path d="M178 362 L334 362"/>
        <path d="M140 436 L372 436"/>
    </g>
</svg>
